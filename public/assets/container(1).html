:root {
  /* Colors */
  --banner-color-foreground-default: #191A1B;
  --banner-color-foreground-subtle: #647175;
  --banner-color-background-subtle: #F0F3F5;
  --banner-color-background-default: #FFFFFF;
  --banner-color-gray-80: #3E4142;
  --banner-color-gray-90: #2B2E2F;
  --banner-color-gray-20: #DCE3E6;
  --banner-color-pink-20: #F9D8F2;

  /* Typography */
  --banner-font-family: "Brandon Text", Arial, sans-serif;
  --banner-font-weight-bold: 700;
  --banner-font-weight-normal: 400;

  /* Border Radius */
  --banner-border-radius-small: 2px;
  --banner-border-radius-medium: 4px;
  --banner-border-radius-large: 8px;

  /* Spacing */
  --banner-space-2xs: 2px;
  --banner-space-xs: 4px;
  --banner-space-sm: 8px;
  --banner-space-md: 12px;

  /* Elevation */
  --banner-shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  --banner-shadow-elevated: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

/* Font Face */
@font-face {
  font-family: "Brandon Text";
  src: url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.eot");
  src: local("BrandonText-Bold"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.eot?#iefix") format("embedded-opentype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.woff2") format("woff2"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.woff") format("woff"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.ttf") format("truetype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Bold.svg#BrandonText-Bold") format("svg");
  font-weight: 700;
  font-style: normal;
}

@font-face {
  font-family: "Brandon Text";
  src: url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.eot");
  src: local("BrandonText-Regular"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.eot?#iefix") format("embedded-opentype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.woff2") format("woff2"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.woff") format("woff"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.ttf") format("truetype"),
    url("https://cdn.smartnordstrom.com/~cdn/Content/fonts/BrandonText/BrandonText-Regular.svg#BrandonText-Regular") format("svg");
  font-weight: 400;
  font-style: normal;
}

/* ============================================
   WRAPPER
   ============================================ */

.banner__wrapper {
  max-width: 1600px;
  container-type: inline-size;
  font-family: var(--banner-font-family);
}

a:link {
  text-decoration: none;
}

/* ============================================
   BANNER CONTAINER
   ============================================ */

.banner {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: var(--banner-border-radius-large);
  display: flex;
  flex-direction: column;
  box-shadow: var(--banner-shadow-subtle);
  transition: box-shadow 0.2s ease;
  cursor: pointer;
  box-sizing: border-box;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  container-name: banner;
  container-type: inline-size;
  height: 13.67cqw;
  min-height: 130px;
}

.banner:hover {
  box-shadow: var(--banner-shadow-elevated);
}

/* === Background with Gradient Overlay === */

/* Background from GAM macros */
.banner {
  --bg-color: #F3F0EF;
  --bg-image: url('');
  background-color: var(--bg-color);
  background-image: var(--bg-image);
}

/* Light gradient overlay */
.banner.banner--gradient-light {
  background-image:
    linear-gradient(90deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.40) 75%),
    var(--bg-image);
}

/* Dark gradient overlay */
.banner.banner--gradient-dark {
  background-image:
    linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.18) 75%),
    var(--bg-image);
}

/* ============================================
   CONTENT LAYOUT
   ============================================ */

.banner__content {
  position: relative;
  z-index: 1;
  display: flex;
  padding: 8px;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 100%;
  max-width: 1600px;
  margin: 0 auto;
  box-sizing: border-box;
}

/* Text Content Block */
.banner__text {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  height: 100%;
}

.banner__text-inner {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.banner__text-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ============================================
   TEXT ELEMENTS
   ============================================ */

.banner__badge {
  display: flex;
  padding: var(--banner-space-2xs) var(--banner-space-xs);
  justify-content: center;
  align-items: center;
  align-self: flex-start;
  border-radius: var(--banner-border-radius-small);
  background: var(--banner-color-pink-20);
  color: var(--banner-color-foreground-default);
  font-feature-settings: 'liga' off, 'clig' off;
  font-size: 12px;
  font-style: normal;
  font-weight: var(--banner-font-weight-bold);
  line-height: 1.333;
  white-space: nowrap;
  position: relative;
  z-index: 2;
}

/* Hide badge when enticement is disabled */
.banner__wrapper.banner--enticement-No .banner__badge {
  display: none;
}

.banner__headline {
  font-size: 16px;
  font-weight: var(--banner-font-weight-bold);
  margin: 0;
  line-height: 1.5;
}

.banner__body {
  font-size: 12px;
  font-weight: var(--banner-font-weight-normal);
  margin: 0;
  line-height: 1.333;
  display: none;
}

/* Text color based on text variant */
.banner.banner--text-dark .banner__headline,
.banner.banner--text-dark .banner__body {
  color: #000000;
}

.banner.banner--text-light .banner__headline,
.banner.banner--text-light .banner__body {
  color: #FFFFFF;
}

.banner__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--banner-font-family);
  font-size: 12px;
  font-weight: var(--banner-font-weight-bold);
  background: var(--banner-color-background-subtle);
  color: var(--banner-color-foreground-default);
  border: none;
  border-radius: var(--banner-border-radius-medium);
  padding: 6px 12px;
  min-height: 32px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  text-decoration: none;
  align-self: flex-start;
}

/* Button Variants */
.banner__button.banner__button--dark {
  background: var(--banner-color-foreground-default);
  color: var(--banner-color-background-default);
}

.banner__button.banner__button--dark:hover,
.banner:hover .banner__button.banner__button--dark {
  background: var(--banner-color-gray-80);
}

.banner__button.banner__button--dark:active {
  background: var(--banner-color-gray-90);
}

.banner__button.banner__button--light {
  background: var(--banner-color-background-default);
  color: var(--banner-color-foreground-default);
}

.banner__button.banner__button--light:hover,
.banner:hover .banner__button.banner__button--light {
  background: var(--banner-color-background-subtle);
}

.banner__button.banner__button--light:active {
  background: var(--banner-color-gray-20);
}

.banner__button:focus {
  outline: none;
}

.banner__button:focus-visible {
  outline: 2px solid var(--banner-color-foreground-default);
  outline-offset: 2px;
}

/* ============================================
   IMAGE CONTAINER
   ============================================ */

/* Atomic Image Component */
.banner__image {
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  height: 100%;
  aspect-ratio: 5 / 4;
}

/* Background rendered as a child so overflow:hidden+border-radius clips it to rounded corners */
.banner__image::before {
  content: '';
  position: absolute;
  inset: 0;
  /* Background image from CSS custom properties - default to desktop */
  background-image: var(--img-dt);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.banner__image--inset {
  border-radius: var(--banner-border-radius-medium);
  border: 1px solid rgba(25, 26, 27, 0.10);
}

/* ============================================
   FOOTER
   ============================================ */

.banner__footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--banner-space-xs);
  font-size: 12px;
  font-weight: var(--banner-font-weight-normal);
  line-height: 1.333;
  width: 100%;
  color: var(--banner-color-foreground-subtle);
}

.banner__footer-right {
  display: flex;
  align-items: center;
  gap: var(--banner-space-xs);
  margin-left: auto;
}

.banner__ai-disclosure {
  flex: 1;
}

.banner__wrapper.banner--ai-False .banner__ai-disclosure {
  display: none;
}

.banner__link {
  text-decoration: none !important;
  display: inline-block;
  color: var(--banner-color-foreground-subtle);
  border-bottom: 1px solid var(--banner-color-foreground-subtle);
}

/* Hide disclaimer link when disclaimer is disabled */
.banner__wrapper.banner--disclaimer-No .banner__link {
  display: none;
}

.banner__label {
  color: var(--banner-color-foreground-subtle);
}

/* Hide sponsored label when not sponsored */
.banner__wrapper.banner--sponsored-No .banner__label {
  display: none;
}

/* ============================================
   TIER MODIFIERS - BASE (Mobile First)
   ============================================ */

/* Tier 1: Single large image, 4:1 aspect ratio */
.banner.banner--tier1 .banner__image {
  aspect-ratio: 4 / 1;
}

/* Tier 1: Hide 2nd and 3rd images */
.banner.banner--tier1 .banner__image-2,
.banner.banner--tier1 .banner__image-3 {
  display: none;
}

/* Tier 2: Two images, 8:5 aspect ratio */
.banner.banner--tier2 .banner__image {
  aspect-ratio: 8 / 5;
}

/* Tier 2: Hide 3rd image */
.banner.banner--tier2 .banner__image-3 {
  display: none;
}

/* ============================================
   CONTAINER QUERIES
   ============================================ */

/* === Responsive Image Switching (DT to MOW) === */

/* Tier 1: Switch to MOW below 600px */
@container (max-width: 599px) {
  .banner.banner--tier1 .banner__image::before {
    background-image: var(--img-mow);
  }
}

/* Tier 2: Switch to MOW below 900px */
@container (max-width: 899px) {
  .banner.banner--tier2 .banner__image::before {
    background-image: var(--img-mow);
  }
}

/* Tier 3 (no enticement): Switch to MOW below 768px */
@container (max-width: 767px) {
  .banner__wrapper:not(.banner--enticement-Yes) .banner.banner--tier3 .banner__image::before {
    background-image: var(--img-mow);
  }
}

/* Tier 3 (with enticement): Switch to MOW and adjust aspect ratio below 900px */
@container (max-width: 899px) {
  .banner__wrapper.banner--enticement-Yes .banner.banner--tier3 .banner__image {
    aspect-ratio: 5 / 4;
  }

  .banner__wrapper.banner--enticement-Yes .banner.banner--tier3 .banner__image::before {
    background-image: var(--img-mow);
  }
}

/* === Body Text Visibility for Long Text === */
/* Hide body when: tier 2/3 + enticement + long text + width < 1440px */
@container (max-width: 1439px) {
  .banner__wrapper.banner--enticement-Yes .banner.banner--tier2.banner--long-text .banner__body,
  .banner__wrapper.banner--enticement-Yes .banner.banner--tier3.banner--long-text .banner__body {
    display: none;
  }
}

/* Reduce min-height below 428px */
@container (max-width: 428px) {
  .banner {
    min-height: 96px;
  }

  .banner__headline {
    font-size: 14px;
    line-height: 1.5;
  }

  .banner__text-inner {
    gap: 4px;
  }

  .banner__text-group {
    gap: 4px;
  }

  /* Tier 2 & 3: Tighter gaps at smallest breakpoint */
  .banner.banner--tier2 .banner__content,
  .banner.banner--tier3 .banner__content {
    gap: 4px;
  }
}

/* Below 600px adjustments */
@container (max-width: 600px) {
  /* Banner hugs content height at mobile — images use fixed width so aspect-ratio drives height */
  .banner {
    height: auto;
  }

  .banner__content {
    flex: 1;
  }

  /* Tier 1: fixed width, 2.25:1 aspect ratio */
  .banner.banner--tier1 .banner__image {
    height: auto;
    width: 56cqw;
    aspect-ratio: 2.25 / 1;
  }

  /* Tier 2: fixed width per image, 5:4 aspect ratio */
  .banner.banner--tier2 .banner__image {
    height: auto;
    width: 27cqw;
    aspect-ratio: 5 / 4;
  }

  /* Tier 3: Hide 3rd image, fixed width, 5:4 aspect ratio */
  .banner.banner--tier3 .banner__image-3 {
    display: none !important;
  }

  .banner.banner--tier3 .banner__image {
    height: auto;
    width: 27cqw;
    aspect-ratio: 5 / 4;
  }

  /* All tiers: Remove padding from text container below 600px */
  .banner .banner__text {
    padding: 0;
  }

  /* With enticement: smaller headline for more text space */
  .banner__wrapper.banner--enticement-Yes .banner .banner__headline {
    font-size: 12px;
    line-height: 1.333;
  }
}

/* 768px and above */
@container (min-width: 768px) {
  /* Tier 2: Both images 8:5 */
  .banner.banner--tier2 .banner__image {
    aspect-ratio: 8 / 5;
  }

  /* Tier 3: All images 8:5 */
  .banner.banner--tier3 .banner__image {
    aspect-ratio: 8 / 5;
  }
}

/* 873px and above */
@container (min-width: 873px) {
  /* Show body text */
  .banner__body {
    display: block;
  }
}

/* 900px and above */
@container (min-width: 900px) {
  /* Text spacing */
  .banner__text-inner {
    gap: 12px;
  }

  /* Tier 2: Both images switch to 3:1 at 900px+ */
  .banner.banner--tier2 .banner__image {
    aspect-ratio: 3 / 1;
  }
}

/* 1200px and above */
@container (min-width: 1200px) {
  /* Add padding to text at desktop sizes */
  .banner__text {
    padding: 8px;
  }

  /* Tier 3: 2:1 aspect ratio */
  .banner.banner--tier3 .banner__image {
    aspect-ratio: 2 / 1;
  }

  /* Desktop typography */
  .banner__headline {
    font-size: 20px;
    line-height: 1.4;
  }

  .banner__body {
    font-size: 14px;
    line-height: 1.5;
  }
}

@container (min-width: 1200px) and (max-width: 1439px) {
  .banner__wrapper.banner--enticement-Yes .banner.banner--tier3 .banner__image {
    aspect-ratio: 8 / 5;
  }
}

@container (min-width: 1440px) {
  /* Large desktop typography */
  .banner__headline {
    font-size: 24px;
    line-height: 1.333;
  }

  .banner__body {
    font-size: 16px;
    line-height: 1.5;
  }

  /* Tier 3 with enticement: 2:1 aspect ratio */
  .banner__wrapper.banner--enticement-Yes .banner.banner--tier3 .banner__image {
    aspect-ratio: 2 / 1;
  }
}

/* ============================================
   MOBILE MEDIA QUERIES
   ============================================ */

/*
  * 768px breakpoint matches platform standard (ndls-layout-breakpoint-medium)
  * Used across content pages and product results for mobile/desktop switch
*/
@media only screen and (max-width: 767px) {
  .banner__wrapper {
    padding-left: 16px;
    padding-right: 16px;
  }
}

@media only screen and (max-width: 428px) {
  .banner {
    min-height: 96px;
  }

  .banner.banner--tier2 .banner__content,
  .banner.banner--tier3 .banner__content {
    padding: var(--banner-space-sm);
  }

  .banner.banner--tier2 .banner__content,
  .banner.banner--tier3 .banner__content {
    gap: var(--banner-space-xs);
  }
}
